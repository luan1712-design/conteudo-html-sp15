<!DOCTYPE html>
<html lang="pt-br">
    <head>

        <title>Content Class13 - HTML</title>

        <style>

            .important {
                color: red;
                font-weight: bold;
                font-size:150%;
            }

            .cities {
                background-color: purple;
                border: 6px darkorchid;
                color: ghostwhite;
                padding: 10px;
            }

            .centralizando {
                text-align: center;
            }

            .style {
                background-color: navy;
                color: aliceblue;
                padding: 10px;
                border: 4px solid goldenrod;
            }

        </style>

    </head>
    <body>

        <h1>Class on HTML</h1>

        <h2>Títule <span class="important">important</span> on HTML</h2>

        <p>Example of content <span class="important">important</span> on HTML</p>

        <hr>

        <h3>Defing more of an class for elements</h3>

        <h2 class="cities centralizado">San Paulo</h2>
        <h2 class="cities">River of January</h2>
        <h2 class="cities">Natal</h2>

        <hr>

        <h3>Mesmas classes in differents elements </h3>

        <h2 class="style">I am a h2</h2>
        <p class="style">I am a paragraph.</p>
        
    </body>
</html>
