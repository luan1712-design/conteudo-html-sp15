<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Content Class14 - HTML</title>
</head>
    <body>

        <h1>JavaScript on HTML</h1>

        <h3>Altering values of atributes with the JavaScript</h3>

        <img id="img-element" src=" l-lightoff.gif" width="100" height="100">

        <br>

        <button onclick="controlarLampada(1)">Acender Lâmpada
        </button>
        <button onclick="controlarLampada(0)">Apagar Lâmpada</button>

<script>

    function controlarLampada(interruptor) {

    var nameImage;

    if (interruptor == 0) {
        nameImage = "l-lightoff.gif";
    } else {
        nameImage = "l-lighton.gif";
    }

    document.getElementById("img-element").src = nameImage;
} 

</script>
    
    </body>
</html>
